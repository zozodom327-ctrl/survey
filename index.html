<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SurveyForPerfection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
  <!-- Bump ?v= whenever style.css or app.js change, so browsers fetch the new copy straight away. -->
  <link rel="stylesheet" href="style.css?v=2026-11-04">
</head>
<body>
  <div class="editbar" id="editbar" hidden>
    <strong>Editor</strong>
    <span class="muted small">Ctrl+E to close</span>
    <button type="button" class="btn-small" id="close-editor">Back to survey</button>
  </div>

  <main id="app" class="container" aria-live="polite">
    <p class="muted">Loading…</p>
  </main>

  <noscript><p class="container">This survey needs JavaScript turned on.</p></noscript>
  <script src="app.js?v=2026-11-04"></script>
</body>
</html>
